[workspace]
resolver = "2"
members = [
    "apps/gui",
    "crates/bugtools-core",
    "crates/bugtools-scope",
    "crates/bugtools-storage",
    "crates/bugtools-events",
    "crates/bugtools-http",
    "crates/bugtools-fingerprint",
    "crates/bugtools-scheduler",
    "crates/bugtools-sql",
    "crates/bugtools-parser",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BugTools Research Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = { version = "2.5", features = ["serde"] }
regex = "1.10"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
eframe = "0.29"
egui = "0.29"
