[package]
name = "bugtools-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true


[dependencies]
bugtools-core = { path = "../../crates/bugtools-core" }
bugtools-scope = { path = "../../crates/bugtools-scope" }
bugtools-storage = { path = "../../crates/bugtools-storage" }
bugtools-events = { path = "../../crates/bugtools-events" }
bugtools-scheduler = { path = "../../crates/bugtools-scheduler" }
bugtools-fingerprint = { path = "../../crates/bugtools-fingerprint" }
bugtools-sql = { path = "../../crates/bugtools-sql" }
bugtools-http = { path = "../../crates/bugtools-http" }

eframe = { workspace = true, features = ["wgpu"] }
egui = { workspace = true }
egui_extras = { version = "0.29", features = ["svg", "image"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
sysinfo = "0.38.4"
tracing-subscriber = "0.3.23"
reqwest = { workspace = true, features = ["json"] }
rfd = "0.15"
